<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Worlorn</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05030a}
canvas{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.hud{position:fixed;font-family:'Press Start 2P',monospace;color:#f0dcc4;pointer-events:none;text-shadow:2px 2px 0 #000}
#zone{top:9%;left:50%;transform:translateX(-50%);font-size:clamp(12px,2.3vw,24px);letter-spacing:5px;opacity:0;transition:opacity 1.2s;text-align:center;white-space:nowrap;color:#ffb070}
#zone small{display:block;font-size:.42em;color:#c8a890;margin-top:12px;letter-spacing:3px}
#tl{top:16px;left:18px;font-size:10px;color:#a08070;letter-spacing:3px;opacity:.8}
#hint{bottom:18px;left:50%;transform:translateX(-50%);font-size:clamp(7px,1vw,9px);color:#c8b0a0;background:#000a;padding:9px 13px;border:2px solid #5a3a22;white-space:nowrap;transition:opacity 1.2s}
#title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(ellipse at center,#0004 0%,#000d 80%);font-family:'Press Start 2P',monospace;transition:opacity 1.4s;cursor:pointer;text-align:center;padding:16px;box-sizing:border-box}
#title h1{margin:0;font-size:clamp(18px,5vw,52px);line-height:1.35;color:#ff7a2a;letter-spacing:5px;text-shadow:0 0 22px #ff4a1a99,4px 4px 0 #2a0a06;font-weight:normal}
#title p{margin:0;color:#c8a890;font-size:clamp(7px,1.2vw,11px);letter-spacing:4px;line-height:1.8}
#title .blink{animation:bl 1.2s steps(2) infinite;color:#f0dcc4;font-size:clamp(8px,1.3vw,12px)}
@keyframes bl{50%{opacity:0}}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* ---- controles táctiles ---- */
.tc{display:none}
body.touch .tc{display:block}
#joy{position:fixed;left:calc(96px + env(safe-area-inset-left));top:calc(100% - 96px - env(safe-area-inset-bottom));width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:3px solid #f0dcc455;background:radial-gradient(circle,#0006 0%,#0003 70%);opacity:.45;pointer-events:none;transition:opacity .2s}
#joy.on{opacity:.9}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;border-radius:50%;background:#ff7a2acc;border:3px solid #ffd2a0;box-shadow:0 0 14px #ff5a1a88;transform:translate(-50%,-50%)}
.tbtn{position:fixed;font-family:'Press Start 2P',monospace;color:#f0dcc4;background:#000a;border:3px solid #5a3a22;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none}
#run{right:calc(28px + env(safe-area-inset-right));bottom:calc(36px + env(safe-area-inset-bottom));width:84px;height:84px;font-size:9px;line-height:1.6;text-align:center}
#run.active{background:#ff7a2a;color:#1a0a06;border-color:#ffd2a0;box-shadow:0 0 18px #ff5a1a}
#fsb{right:calc(14px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:44px;height:44px;border-radius:8px;font-size:22px;font-family:system-ui,sans-serif}
body.touch #hint{bottom:auto;top:calc(40px + env(safe-area-inset-top));font-size:7px}
body.touch #tl{top:calc(16px + env(safe-area-inset-top));left:calc(18px + env(safe-area-inset-left))}
#rot{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.8;color:#f0dcc4;background:#000c;border:2px solid #ff7a2a;padding:14px 16px;text-align:center;pointer-events:none;transition:opacity .6s;display:none;width:min(80vw,280px)}
@media (orientation:portrait){body.touch.started #rot{display:block}}
body.touch.started.rotok #rot{opacity:0}
</style>

<body>
<canvas id="c"></canvas>
<div class="hud" id="tl">WORLORN</div>
<div class="hud" id="zone"></div>
<div class="hud" id="hint">A/D · W/S MOVERSE &nbsp;·&nbsp; SHIFT CORRER &nbsp;·&nbsp; F PANTALLA COMPLETA</div>
<div class="tc" id="joy"><div id="knob"></div></div>
<div class="tc tbtn" id="run">▶▶<br>CORRER</div>
<div class="tc tbtn" id="fsb">⤢</div>
<div id="rot">📱↻<br>GIRA EL TELÉFONO<br>PARA VER MÁS DEL MUNDO</div>
<div id="title"><p>BASADO EN LA NOVELA DE GEORGE R. R. MARTIN</p><h1>LA MUERTE<br>DE LA LUZ</h1><p class="blink">PULSA CUALQUIER TECLA</p></div>
<script>
(()=>{
/* ================= core ================= */
const H=270,WORLD=1800,MAXV=640,MINV=300;
let VW=480;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let g=ctx,BUF=null;
const CC={};
const rgb=c=>CC[c]||(CC[c]=(n=>[n>>16&255,n>>8&255,n&255])(parseInt(c.slice(1),16)));
function P(c,x,y,w=1,h=1){x=Math.round(x);y=Math.round(y);
  if(BUF){const v=rgb(c),d=BUF.d,W=BUF.w;x-=BUF.ox;y-=BUF.oy;
    const x0=Math.max(0,x),x1=Math.min(W,x+w),y0=Math.max(0,y),y1=Math.min(BUF.h,y+h);
    for(let j=y0;j<y1;j++)for(let i=x0;i<x1;i++){const k=(j*W+i)*4;d[k]=v[0];d[k+1]=v[1];d[k+2]=v[2];d[k+3]=255;}return;}
  g.fillStyle=c;g.fillRect(x,y,w,h);}
function canvasOf(w,h,ox,oy,fn){const c=document.createElement('canvas');c.width=Math.ceil(w);c.height=h;
  const cx=c.getContext('2d'),id=cx.createImageData(c.width,h),old=BUF;BUF={d:id.data,w:c.width,h,ox,oy};fn(c.width,h);cx.putImageData(id,0,0);BUF=old;return c;}
const layer=(w,fn)=>canvasOf(w,H,0,0,fn);
let seed=20261014;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const BY=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const D=(x,y)=>(BY[y&3][x&3]+.5)/16;
const hash=(x,y)=>{let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296};
const sm=t=>t*t*(3-2*t);
const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),u=sm(x-xi),v=sm(y-yi),a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
const fbm=(x,y,o=4)=>{let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*vn(x*f+i*17,y*f+i*31);n+=a;a*=.5;f*=2}return s/n};
const dp=(cols,t,x,y)=>{t=Math.max(0,Math.min(.9999,t))*(cols.length-1);const i=Math.floor(t);return cols[(t-i)>D(x,y)?Math.min(i+1,cols.length-1):i]};
const lw=f=>Math.ceil(MAXV+(WORLD-MINV)*f+4);
const mix=(a,b,k)=>{k=Math.round(Math.max(0,Math.min(1,k))*6)/6;const A=rgb(a),B=rgb(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'};
function line(x0,y0,x1,y1,c,w=1){const n=Math.max(1,Math.ceil(Math.max(Math.abs(x1-x0),Math.abs(y1-y0))));for(let i=0;i<=n;i++)P(c,x0+(x1-x0)*i/n-(w>>1),y0+(y1-y0)*i/n,w,1)}
function tree(x,y,len,ang,d,c,rim){if(d===0||len<1.2)return;
  const x1=x+Math.cos(ang)*len,y1=y+Math.sin(ang)*len,w=d>=6?3:d>=4?2:1;
  line(x,y,x1,y1,c,w);if(rim&&d>=3)line(x-(w>>1),y,x1-(w>>1),y1,rim,1);
  const n=d>=4?2:(rnd()<.5?2:3);
  for(let i=0;i<n;i++)tree(x1,y1,len*(.62+rnd()*.14),ang+(rnd()-.5)*1.1+(i-(n-1)/2)*.62,d-1,c,rim);}
const F={sky:.04,far:.15,mid:.4,city:.65,ground:1,fore:1.25};

/* ================= sky ================= */
const HUB={x:190,y:92,r:56};
const SUNS=[[420,48,3],[455,74,2],[490,36,2],[524,60,1],[372,26,1]];
const stars=[];
const skyC=['#07051a','#0c0820','#120b28','#1a0e31','#24113a','#30133f','#401642','#541a42','#6a1f40','#82263c','#9c3036','#b84030','#d0582c'];
const nebC=['#1c0e34','#2a1242','#3a174e','#4c1e5a'];
const skyL=layer(lw(F.sky),W=>{
  for(let y=0;y<200;y++)for(let x=0;x<W;x++){
    let c=dp(skyC,Math.pow(y/196,1.35),x,y);
    if(y<150){const n=fbm(x*.011,y*.022,5),band=1-Math.abs(y-60+(x-350)*.18)/70,v=n*.9+band*.35-.62;
      if(v>D(x,y)*.25)c=dp(nebC,v*2.2,x,y);}
    P(c,x,y);}
  for(let i=0;i<460;i++){const x=Math.floor(rnd()*W),y=Math.floor(Math.pow(rnd(),1.4)*150);
    if(Math.hypot(x-HUB.x,y-HUB.y)<HUB.r+34)continue;const b=rnd();
    P(b>.9?'#ffffff':b>.6?'#c8c0e8':b>.3?'#8a7cb0':'#5a4c80',x,y);
    if(b>.975){P('#8a80c0',x-1,y);P('#8a80c0',x+1,y);P('#8a80c0',x,y-1);P('#8a80c0',x,y+1);}
    if(b>.7&&stars.length<110)stars.push({x,y,sp:.8+rnd()*3,ph:rnd()*7});}
  const hubC=['#fff4cc','#ffe090','#ffc060','#ffa048','#ff8236','#f0642c','#d84a24','#b8341e','#8a2218'],R=HUB.r;
  for(let y=HUB.y-R-36;y<=HUB.y+R+36;y++)for(let x=HUB.x-R-36;x<=HUB.x+R+36;x++){
    if(x<0||y<0||x>=W||y>=200)continue;const dx=x-HUB.x,dy=y-HUB.y,d=Math.hypot(dx,dy);
    if(d<R){const gr=fbm(x*.14,y*.14,3),sp=fbm(x*.09+40,y*.09,3);
      let c=dp(hubC,Math.pow(d/R,2.2)*.82+(gr-.5)*.45+.04,x,y);
      if(sp>.735&&d<R-4)c=sp>.76?'#7a1a10':'#a8341a';P(c,x,y);}
    else if(d<R+36){const k=1-(d-R)/36,a=Math.atan2(dy,dx),ray=.55+.45*Math.sin(a*11+vn(a*2+5,1)*5),v=k*k*(.55+.45*ray);
      if(v>D(x,y)*.9)P(v>.6?'#ff7a3a':v>.4?'#e0503a':v>.22?'#b0343e':'#7e2440',x,y);}}
  SUNS.forEach(([sx,sy,s])=>{const hr=s*4+3;
    for(let y=sy-hr;y<=sy+hr;y++)for(let x=sx-hr;x<=sx+hr;x++){const d=Math.hypot(x-sx,y-sy);
      if(d<=s*.8+.5)P(d<s*.4+.3?'#fffbe8':'#ffe68a',x,y);
      else if(d<hr){const k=1-d/hr;if(k*k>D(x,y))P(k>.5?'#ffc860':k>.25?'#c88a50':'#8a5048',x,y);}}
    for(let k=1;k<=s+3;k++){const c=k<=s+1?'#ffe68a':'#c89a60';P(c,sx+s+k,sy);P(c,sx-s-k,sy);P(c,sx,sy+s+k);P(c,sx,sy-s-k);}});
});

/* ================= far mountains ================= */
const farY=x=>Math.round(146+(fbm(x*.006,3,4)-.5)*90+(fbm(x*.04,8,3)-.5)*14);
const farL=layer(lw(F.far),W=>{
  for(let x=0;x<W;x++){const top=farY(x),sl=farY(x+2)-farY(x-2);
    for(let y=Math.max(0,top);y<205;y++){const dd=y-top,haze=dd/(205-top);let c;
      if(dd<2)c=sl<0?'#e08a8a':(sl>1?'#4a2240':'#a85a6a');
      else if(dd<20&&fbm(x*.09,y*.12,3)>.56-dd*.004)c=sl<0?'#b86a7a':'#6a3a5a';
      else c=dp(['#2a1636','#34193c','#3e1c42','#4a2046'],haze*.9+(fbm(x*.03,y*.03,2)-.5)*.3,x,y);
      P(c,x,y);}}
});

/* ================= mid hills + Kryne Lamiya ================= */
const KLX=830;
const midY=x=>{const b=Math.max(0,1-Math.abs(x-KLX)/150);return Math.round(174+(fbm(x*.008,11,4)-.5)*36-sm(b)*30)};
const klSpires=[];
const midL=layer(lw(F.mid),W=>{
  for(let x=0;x<W;x++){const top=midY(x),sl=midY(x+2)-midY(x-2);
    for(let y=top;y<205;y++){const dd=y-top;
      P(dd<1?(sl<0?'#7a3050':'#3a1a36'):dp(['#2a1430','#22102a','#1c0d24','#180a1e'],dd/30+(fbm(x*.05,y*.05,2)-.5)*.4,x,y),x,y);}}
  for(let i=0;i<46;i++){const x=Math.floor(rnd()*W);if(Math.abs(x-KLX)<150)continue;tree(x,midY(x)+1,4+rnd()*5,-Math.PI/2+(rnd()-.5)*.3,4,'#140a1a');}
  for(let x=KLX-106;x<KLX+110;x+=4+Math.floor(rnd()*6)){const c=1-Math.min(1,Math.abs(x-KLX)/115),h=Math.round(16+c*c*95*(.55+rnd()*.45)),w=2+Math.floor(rnd()*3)+(h>70?2:0);
    klSpires.push({x,h,w,b:midY(x+(w>>1))+3});}
  const byX=[...klSpires].sort((a,b)=>a.x-b.x);
  for(let i=0;i<byX.length-1;i++){const a=byX[i],b=byX[i+1];if(a.h>30&&b.h>30&&rnd()<.6){const y0=Math.max(a.b-a.h,b.b-b.h)+8+Math.floor(rnd()*14),x0=a.x+a.w,x1=b.x;
    for(let x=x0;x<x1;x++){const k=(x-x0)/Math.max(1,x1-x0);P('#c8c0dc',x,y0+Math.round(Math.sin(k*Math.PI)*-3));}}}
  [...klSpires].sort((a,b)=>b.h-a.h).forEach(({x,h,w,b})=>{const top=b-h;
    for(let y=top;y<b;y++)for(let i=0;i<w;i++)P(i===0?'#f6dcd8':i===w-1?'#8e84ae':(w>3&&i===w-2?'#b0a6cc':(D(x+i,y)>.85?'#c8c0e0':'#d8d0ea')),x+i,y);
    if(w>2)for(let y=top+5;y<b-3;y+=7)P('#5a5080',x+1,y,1,2);
    for(let k=0;k<Math.ceil(w/2);k++)P(k===0?'#e8e0f8':'#d8d0ea',x+k,top-1-k,Math.max(1,w-2*k),1);
    const nx=x+((w-1)>>1),nh=3+Math.round(h*.12);P('#ffffff',nx,top-Math.ceil(w/2)-nh,1,nh);
    if(h>40){const ry=top+Math.round(h*.22);P('#f0e8ff',x-1,ry,w+2,1);P('#8e84ae',x-1,ry+1,w+2,1);}
    if(h>70){const ry=top+Math.round(h*.5);P('#f0e8ff',x-1,ry,w+2,1);P('#8e84ae',x-1,ry+1,w+2,1);}});
  for(let x=KLX-140;x<KLX+140;x++){const t=midY(x);for(let y=t-10;y<t+3;y++){const k=1-Math.abs(x-KLX)/140;if(D(x,y)<.22*k*(1-(t-y)/10))P('#6a5a80',x,y);}}
});

/* ================= Larteyn ================= */
const cragY=x=>{let y=146;if(x<36)y+=(36-x)*1.4;if(x>300)y+=Math.pow((x-300)/110,2)*62;return Math.round(y+(fbm(x*.05,21,3)-.5)*10)};
const seams=[],wins=[],tips=[];
const cityL=layer(lw(F.city),W=>{
  for(let x=0;x<440;x++){const top=cragY(x);if(top>=205)continue;const sl=cragY(x+2)-cragY(x-2);
    for(let y=top;y<205;y++){const dd=y-top;let c;
      if(dd<2)c=sl<0?'#8a3424':'#5a2218';
      else{c=dp(['#120807','#1c0d0a','#26120e','#321812'],fbm(x*.07,y*.07,3)*1.2-.1-(dd>40?.15:0),x,y);
        if(fbm(x*.25,y*.04,2)>.66)c='#0c0505';if(sl<-2&&dd<10)c='#4a1e16';}
      P(c,x,y);}}
  for(let x=34;x<330;x++){const b=cragY(x);for(let y=b-10;y<b+2;y++)P(y===b-10?'#7a2a1c':(D(x,y)>.8?'#3a120e':'#2e0e0b'),x,y);if(x%4<2)P('#5a1e16',x,b-12,1,2);}
  const drawTower=(x,w,h,dim,roof)=>{const base=cragY(x+(w>>1))+4,top=base-h;
    const C=dim?['#6a2418','#4a1810','#2e0e0b','#260c0a','#1a0807','#120505']:['#b84a2a','#8a3220','#521a12','#46160f','#2c0c0a','#160505'];
    for(let y=top;y<base;y++)for(let i=0;i<w;i++)P(i===0?C[0]:i===1?C[1]:i===w-1?C[5]:i===w-2?C[4]:(D(x+i,y)>.75?C[3]:C[2]),x+i,y);
    for(let y=top+6;y<base-2;y+=9){P(dim?'#1a0606':'#2a0a07',x,y,w,1);if(!dim)seams.push([x,y,w]);}
    for(let wy=top+4;wy<base-8;wy+=9)for(let wx=x+2;wx<x+w-3;wx+=4)if(rnd()<.6){P('#120404',wx,wy,2,3);wins.push([wx,wy,rnd()*6.28,dim]);}
    const r=roof!==undefined?roof:rnd();
    if(r<.5){const hh=Math.ceil(w*1.3);for(let k=0;k<hh;k++){const ww=Math.max(1,Math.round(w*(1-k/hh))),xx=x+Math.round((w-ww)/2);P(C[2],xx,top-1-k,ww,1);P(C[0],xx,top-1-k);if(ww>2)P(C[5],xx+ww-1,top-1-k);}
      const tx=x+((w-1)>>1),nh=3+Math.floor(rnd()*5);P(C[1],tx,top-hh-nh,1,nh);tips.push([tx,top-hh-nh-1,rnd()*6]);}
    else if(r<.8){P(C[0],x-1,top-2,w+2,2);for(let i=-1;i<w+1;i+=3)P(C[1],x+i,top-4,2,2);}
    else{const rr=w/2;for(let k=0;k<=rr;k++){const ww=Math.max(1,Math.round(2*Math.sqrt(rr*rr-k*k))),xx=x+Math.round((w-ww)/2);P(C[2],xx,top-1-k,ww,1);P(C[0],xx,top-1-k);P(C[5],xx+ww-1,top-1-k);}
      const tx=x+((w-1)>>1);P(C[1],tx,top-Math.ceil(rr)-5,1,4);tips.push([tx,top-Math.ceil(rr)-6,rnd()*6]);}
    return {x,w,h,top};};
  let x=40;while(x<320){const w=5+Math.floor(rnd()*7),h=Math.round(50+(1-Math.abs(x-180)/160)*70*(.6+rnd()*.4));drawTower(x,w,h,true);x+=w+3+Math.floor(rnd()*6);}
  const front=[];x=36;while(x<330){const w=7+Math.floor(rnd()*9),h=Math.round(28+(1-Math.abs(x-180)/170)*80*(.5+rnd()*.5));front.push(drawTower(x,w,h,false));x+=w+2+Math.floor(rnd()*7);}
  front.push(drawTower(172,20,132,false,.9));
  front.sort((a,b)=>a.x-b.x);
  for(let i=0;i<front.length-1;i++){const a=front[i],b=front[i+1];if(a.h>45&&b.h>45&&b.x>a.x+a.w&&rnd()<.55){const y=Math.max(a.top,b.top)+12+Math.floor(rnd()*10);
    P('#8a3220',a.x+a.w,y,b.x-a.x-a.w,1);P('#3a120e',a.x+a.w,y+1,b.x-a.x-a.w,2);for(let xx=a.x+a.w;xx<b.x;xx+=3)P('#2a0a08',xx,y+3);}}
});
const cityGlow=layer(lw(F.city),W=>{for(let y=0;y<205;y++)for(let x=0;x<440;x++){const e=((x-185)/215)**2+((y-115)/100)**2;if(e<1){const k=1-e;if(k*k*.6>D(x,y))P(k>.6?'#ff6a2a':'#c83a1a',x,y);}}});

/* ================= ground ================= */
const HZ=186;
const edgeY=x=>HZ+Math.round((fbm(x*.04,41,3)-.5)*6);
const LAKE={x:670,y:213,rx:200,ry:13};

  g.globalAlpha=1;

  const oc=o(F.city);ctx.drawImage(cityL,-oc,0);
  const p=.5+.5*Math.sin(t*1.25);
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.07+.09*p;ctx.drawImage(cityGlow,-oc,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(oc<460){
    for(const [x,y,w] of seams)P(mix('#3a0e08','#ff6a2a',p*(.65+.35*Math.sin(t*2.5+x*.13))),x-oc,y,w,1);
    for(const [x,y,ph,dim] of wins){const v=.6+.4*Math.sin(t*2.4+ph)+(Math.random()<.01?-.6:0);const c=dim?(v>.6?'#c8602a':'#7a2a14'):(v>.75?'#ffe0a0':v>.35?'#ff9a40':'#7a2410');P(c,x-oc,y+1,2,2);P(c,x-oc,y);}
    for(const [x,y,ph] of tips)if(Math.sin(t*1.4+ph)>.2)P('#ffc080',x-oc,y);
    if(Math.random()<.35&&embers.length<40){const s=seams[Math.floor(Math.random()*seams.length)];embers.push({x:s[0]+Math.random()*s[2],y:s[1],vx:(Math.random()-.3)*4,vy:-6-Math.random()*10,l:0,L:2+Math.random()*3});}
  }
  for(let i=embers.length-1;i>=0;i--){const e=embers[i];e.l+=dt;e.x+=e.vx*dt+Math.sin(t*3+i)*.1;e.y+=e.vy*dt;if(e.l>e.L){embers.splice(i,1);continue;}
    g.globalAlpha=1-e.l/e.L;P(e.l<e.L*.4?'#ffd080':'#ff6a2a',e.x-oc,e.y);}
  g.globalAlpha=1;
  // horizon mist
  for(let y=150;y<200;y+=1)for(let x=0;x<VW;x++){const wx=x+cam*.3;const n=Math.sin(wx*.045+t*.35+y*.21)+Math.sin(wx*.017-t*.2+y*.5)*.8;if(n>1.15+D(x,y)*.7){g.fillStyle=y<180?'rgba(170,110,150,.13)':'rgba(220,150,170,.16)';g.fillRect(x,y,1,1);}}
  // ground
  ctx.drawImage(groundL,-camI,0);
  const hx=HUB.x-os;
  for(let y=LAKE.y-LAKE.ry+1;y<LAKE.y+LAKE.ry;y++){const hw=2+(y-(LAKE.y-LAKE.ry))*.9;for(let sx=Math.round(hx-hw);sx<=Math.round(hx+hw);sx++)
    if(inLake(sx+camI,y)&&Math.sin(y*2.3+t*4+sx*.6)>.1)P(y<LAKE.y-4?'#ffd090':y<LAKE.y+3?'#ff9a4a':'#d0502a',sx,y);}
  const lx=280-oc;for(let y=LAKE.y-LAKE.ry+2;y<LAKE.y+6;y+=2)for(let sx=lx-60;sx<lx+60;sx+=3)if(inLake(sx+camI,y)&&Math.sin(sx*.3+t*2+y)>.75){g.globalAlpha=.35*p;P('#ff6a2a',sx,y,2,1);}
  g.globalAlpha=1;
  for(let k=0;k<8;k++){const y=LAKE.y-9+k*2.4,x=LAKE.x-170+((t*7+k*61)%340);if(inLake(x,y)&&inLake(x+6,y))P('#6a4a7a',x-camI,y,5,1);}
  // depth-sorted actors
  const list=props.filter(q=>q.x-camI<VW&&q.x+q.w-camI>0).map(q=>({b:q.base,q}));
  list.push({b:player.y,a:'p'},{b:npc.y,a:'n'});list.sort((a,b)=>a.b-b.b);
  for(const it of list){
    if(it.q){ctx.drawImage(it.q.c,it.q.x-camI,it.q.y);if(it.q.dyn)it.q.dyn(it.q.ax-camI,t);}
    else if(it.a==='p')drawChar(player.x-camI,player.y,player.face,player.ph,player.moving,DIRK,t);
    else{const near=Math.abs(player.x-npc.x)<40&&Math.abs(player.y-npc.y)<20;const f=player.x<npc.x?-1:1;drawChar(npc.x-camI,npc.y,f,0,false,GWEN,t,true);
      if(near){const bx=npc.x-camI-7,by=npc.y-34;P('#120a0c',bx-1,by-1,17,10);P('#f0dcc4',bx,by,15,8);P('#f0dcc4',bx+4,by+8,3,2);P('#120a0c',bx+3,by+10,1,1);
        for(let i=0;i<3;i++)if(Math.floor(t*3)%4>i)P('#2a1a12',bx+3+i*4,by+4,2,2);}}
  }
  // particles
  for(const a of ash){a.y+=a.v*dt;a.x+=(-6+Math.sin(t*.8+a.ph)*5)*dt;if(a.y>H){a.y=-2;a.x=Math.random()*VW;}if(a.x<-2)a.x=VW+1;if(a.x>VW+2)a.x=-1;
    g.globalAlpha=.55;P(a.c,((a.x-cam*.6)%VW+VW)%VW,a.y);}
  g.globalAlpha=1;
  for(const l of leaves){l.y+=l.v*dt;l.x+=(10+Math.sin(t*1.5+l.ph)*14)*dt;if(l.y>H){l.y=-2;l.x=Math.random()*VW;}
    P(l.c,((l.x-cam*1.1)%VW+VW)%VW,l.y,Math.sin(t*5+l.ph)>0?2:1,1);}
  ctx.drawImage(foreL,-o(F.fore),0);
  if(vign)ctx.drawImage(vign,0,0);
}

/* ================= loop & resize ================= */
function resize(){const a=innerWidth/innerHeight;VW=Math.max(MINV,Math.min(MAXV,Math.round(H*a)));cv.width=VW;cv.height=H;
  const s=a<MINV/H?innerWidth/VW:Math.max(innerWidth/VW,innerHeight/H);cv.style.width=Math.ceil(VW*s)+'px';cv.style.height=Math.ceil(H*s)+'px';
  ctx.imageSmoothingEnabled=false;vign=makeVignette();cam=Math.max(0,Math.min(WORLD-VW,player.x-VW/2));}
addEventListener('resize',resize);resize();
let last=performance.now(),t0=last;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);zones(dt);draw((now-t0)/1000,dt);}
requestAnimationFrame(frame);
})();
</script>
